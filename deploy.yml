---
- name: Configure Nginx
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx on Ubunt/Debian systems
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install Nginx on RedHat systems
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true